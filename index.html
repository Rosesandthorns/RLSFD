<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosie's Living Shiny Dex</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05050f;
            --bg2: #0a0a1e;
            --surface: #0e0e22;
            --surface2: #13132b;
            --border: #1e1e40;
            --border2: #2a2a52;
            --gold: #ffd700;
            --purple: #8b5cf6;
            --text: #e0e0f5;
            --text-dim: #7a7aa6;
            --text-mid: #a0a0d0;
            --caught-glow: rgba(255,215,0,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Barlow Condensed', sans-serif;
            padding: 20px;
            line-height: 1.2;
        }

        header {
            max-width: 1400px;
            margin: 0 auto 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .title-area h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            color: var(--gold);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,215,0,0.2);
        }

        .stats-bar {
            background: var(--surface);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            min-width: 280px;
        }

        .progress-container {
            height: 6px;
            background: var(--bg);
            border-radius: 3px;
            margin: 8px 0;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--purple), var(--gold));
            width: 0%;
            transition: width 0.5s ease;
        }

        .stats-text {
            display: flex;
            justify-content: space-between;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
        }

        .controls {
            margin-bottom: 25px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            background: var(--bg2);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        button {
            background: var(--surface2);
            color: var(--text-mid);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--border);
            color: var(--text);
        }

        button.active {
            background: var(--gold);
            color: var(--bg);
            border-color: var(--gold);
            font-weight: bold;
        }

        .dex-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .group-wrapper {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .group-header {
            background: var(--surface);
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            border-left: 4px solid var(--purple);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }

        .group-header:hover { background: var(--surface2); }
        .group-header.closed { border-left-color: var(--text-dim); border-bottom: none; opacity: 0.8; }

        .group-scroll-area {
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .group-scroll-area.hidden { display: none; }

        .group-grid {
            display: grid;
            grid-template-columns: repeat(6, 100px);
            gap: 10px;
        }

        @media (max-width: 700px) {
            .group-grid { grid-template-columns: repeat(3, 100px); }
        }

        .poke-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 100px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 4px;
            text-align: center;
            transition: all 0.1s ease;
        }

        .poke-card.caught {
            background: var(--bg2);
            border-color: var(--gold);
            box-shadow: inset 0 0 12px var(--caught-glow);
        }

        .sprite-box {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }

        .poke-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: grayscale(0.9) opacity(0.3);
        }

        .poke-card.caught img {
            filter: grayscale(0) opacity(1);
            transform: scale(1.1);
        }

        .poke-name {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .poke-card.caught .poke-name {
            color: var(--text);
        }

        .filter-hide { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="title-area">
        <h1>Rosie's Living Shiny Dex</h1>
        <p style="color: var(--text-dim); font-size: 0.9rem;">National Form Tracker</p>
    </div>
    <div class="stats-bar">
        <div class="stats-text">
            <span id="pct-label">0.00%</span>
            <span><span id="caught-count">0</span> / <span id="total-count">0</span></span>
        </div>
        <div class="progress-container">
            <div id="progress-fill"></div>
        </div>
    </div>
</header>

<div class="controls">
    <button id="f-all" class="active" onclick="setFilter('all')">All</button>
    <button id="f-caught" onclick="setFilter('caught')">Caught</button>
    <button id="f-uncaught" onclick="setFilter('uncaught')">Uncaught</button>
    <div style="width: 2px; height: 20px; background: var(--border); margin: 0 5px;"></div>
    <button onclick="toggleAll(true)">Expand All</button>
    <button onclick="toggleAll(false)">Collapse All</button>
</div>

<div id="dex" class="dex-container"></div>

let caughtSet = new Set(hardcodedCaught);
let currentFilter = 'all';

const homeSharedGenderDiffs = ['rattata', 'raticate', 'scyther', 'murkrow', 'piloswine', 'combee'];

function getSpriteUrls(rawName) {
    let name = rawName.trim().replace('\u2019', "'");
    let lower = name.toLowerCase();
    let base = lower;
    let homeSuffix = '';
    let showdownSuffix = '';

    if (lower.startsWith('unown')) {
        const char = lower.split(' ')[1];
        if (char === '!') homeSuffix = '-exclamation';
        else if (char === '?') homeSuffix = '-question';
        else homeSuffix = `-${char}`;
        base = 'unown';
    } 
    else if (lower.startsWith('oinkologne')) {
        base = 'oinkologne';
        if (lower.includes('- f')) homeSuffix = '-female';
    }
    else if (lower === 'nidoran f') base = 'nidoran-f';
    else if (lower === 'nidoran m') base = 'nidoran-m';
    else if (lower.endsWith(' a')) {
        base = lower.slice(0, -2); homeSuffix = '-alola'; showdownSuffix = '-alola';
    } else if (lower.endsWith(' g')) {
        base = lower.slice(0, -2); homeSuffix = '-galar'; showdownSuffix = '-galar';
    } else if (lower.endsWith(' h')) {
        base = lower.slice(0, -2); homeSuffix = '-hisui'; showdownSuffix = '-hisui';
    } else if (lower.includes('sneasel h')) {
        base = 'sneasel'; homeSuffix = '-hisui'; showdownSuffix = '-hisui';
    }
    else if (lower.endsWith(' m') || lower.endsWith(' f')) {
        let gender = lower.slice(-1);
        let gBase = lower.slice(0, -2);
        if (homeSharedGenderDiffs.includes(gBase)) {
            base = gBase; homeSuffix = '';
        } else {
            if (gender === 'f') { homeSuffix = '-f'; showdownSuffix = '-f'; }
            base = gBase;
        }
    }

    const specialMaps = {
        'great tusk': 'great-tusk', 'scream tail': 'scream-tail', 'brute bonnet': 'brute-bonnet', 
        'flutter mane': 'flutter-mane', 'slither wing': 'slither-wing', 'sandy shocks': 'sandy-shocks',
        'iron treads': 'iron-treads', 'iron bundle': 'iron-bundle', 'iron hands': 'iron-hands',
        'iron jugulis': 'iron-jugulis', 'iron moth': 'iron-moth', 'iron thorns': 'iron-thorns',
        'roaring moon': 'roaring-moon', 'iron valiant': 'iron-valiant'
    };
    if (specialMaps[base]) base = specialMaps[base];

    const formMaps = {
        'sunny': '-sunny', 'rainy': '-rainy', 'snowy': '-snowy', 'west': '-west', 'east': '-east', 
        'spring': '-spring', 'summer': '-summer', 'autumn': '-autumn', 'winter': '-winter', 
        'day': '-midday', 'night': '-midnight', 'dusk': '-dusk', 'incarnate': '', 'therian': '-therian',
        'curly': '-curly', 'droopy': '-droopy', 'stretchy': '-stretchy', 
        'two segment': '-twosegment', 'three segment': '-threesegment', 
        'authentic': '-antique', 'masterpiece': '-masterpiece',
        'family of four': '-four', 'family of three': '-three',
        'green': '-green', 'blue': '-blue', 'yellow': '-yellow', 'white': '-white',
        'origin': '-origin'
    };

    for (let key in formMaps) {
        if (lower.includes(key)) {
            base = lower.split(key)[0].trim().replace(/[^a-z0-9\-]/g, '');
            homeSuffix = formMaps[key];
            showdownSuffix = formMaps[key];
        }
    }

    // Handle "sky" form for Shaymin specially (avoid collision with other suffixes)
    if (lower === 'shaymin sky') {
        base = 'shaymin';
        homeSuffix = '-sky';
        showdownSuffix = '-sky';
    }

    let cleanBase = base.replace(/[^a-z0-9\-]/g, '');
    return {
        home: `https://img.pokemondb.net/sprites/home/shiny/${cleanBase}${homeSuffix}.png`,
        showdown: `https://play.pokemonshowdown.com/sprites/dex-shiny/${cleanBase}${showdownSuffix}.png`
    };
}

function init() {
    const container = document.getElementById('dex');
    const lines = rawList.split('\n').map(l => l.trim()).filter(l => l);
    const blockSize = 30; 

    for (let i = 0; i < lines.length; i += blockSize) {
        const blockNum = Math.floor(i / blockSize) + 1;
        const blockEnd = Math.min(i + blockSize, lines.length);
        const blockLines = lines.slice(i, blockEnd);

        const groupWrap = document.createElement('div');
        groupWrap.className = 'group-wrapper';
        groupWrap.innerHTML = `
            <div class="group-header" id="gh-${blockNum}" onclick="toggleGroup(${blockNum})">
                <span style="font-weight: 600; font-size: 1rem; letter-spacing: 0.5px;">Box ${blockNum} <small style="color:var(--text-dim); font-weight: 400; margin-left: 8px;">(${i+1}&ndash;${blockEnd})</small></span>
                <span id="gs-${blockNum}" style="font-family: 'Space Mono'; font-size: 0.8rem; color: var(--gold)">0 / 30</span>
            </div>
            <div class="group-scroll-area" id="gsa-${blockNum}">
                <div class="group-grid" id="gg-${blockNum}"></div>
            </div>
        `;
        container.appendChild(groupWrap);

        const grid = document.getElementById('gg-' + blockNum);
        blockLines.forEach(name => {
            const urls = getSpriteUrls(name);
            const card = document.createElement('div');
            card.className = 'poke-card' + (caughtSet.has(name) ? ' caught' : '');
            card.innerHTML = `
                <div class="sprite-box">
                    <img src="${urls.home}" 
                         loading="lazy" 
                         alt="${name}"
                         onerror="handleImgErr(this, '${urls.showdown}')">
                </div>
                <div class="poke-info">
                    <div class="poke-name">${name}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }
    updateStats();
}

function handleImgErr(img, backup) {
    if (!img.dataset.triedBackup) {
        img.dataset.triedBackup = "true";
        img.src = backup;
    } else {
        img.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png";
        img.style.opacity = "0.15";
    }
}

function updateStats() {
    const total = rawList.split('\n').filter(l => l.trim()).length;
    const cnt = caughtSet.size;
    const pct = total > 0 ? (cnt / total) * 100 : 0;
    
    document.getElementById('caught-count').textContent = cnt;
    document.getElementById('total-count').textContent  = total;
    document.getElementById('pct-label').textContent    = pct.toFixed(2) + '%';
    document.getElementById('progress-fill').style.width = pct + '%';

    document.querySelectorAll('.group-header').forEach(header => {
        const id = header.id.split('-')[1];
        const grid = document.getElementById('gg-' + id);
        if (grid) {
            const gTotal = grid.querySelectorAll('.poke-card').length;
            const gCaught = grid.querySelectorAll('.poke-card.caught').length;
            const gsSpan = document.getElementById('gs-' + id);
            if (gsSpan) gsSpan.textContent = `${gCaught} / ${gTotal}`;
        }
    });
}

function toggleGroup(g) {
    const scrollArea = document.getElementById('gsa-' + g);
    const hdr  = document.getElementById('gh-' + g);
    if (!scrollArea) return;
    const isHidden = scrollArea.classList.toggle('hidden');
    hdr.classList.toggle('closed', isHidden);
}

function toggleAll(expand) {
    document.querySelectorAll('.group-scroll-area').forEach(scrollArea => {
        scrollArea.classList.toggle('hidden', !expand);
        const id = scrollArea.id.split('-')[1];
        const hdr = document.getElementById('gh-' + id);
        if (hdr) hdr.classList.toggle('closed', !expand);
    });
}

function setFilter(mode) {
    currentFilter = mode;
    ['all','caught','uncaught'].forEach(m => {
        const btn = document.getElementById('f-' + m);
        if (btn) btn.classList.toggle('active', m === mode);
    });
    document.querySelectorAll('.poke-card').forEach(card => {
        const isCaught = card.classList.contains('caught');
        let hide = (currentFilter === 'caught' && !isCaught) || (currentFilter === 'uncaught' && isCaught);
        card.classList.toggle('filter-hide', hide);
    });
}

window.onload = init;
